name: Build and Release NagramNX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v12.10.0-nx1)'
        required: false
        default: 'v12.10.0-nx1'
      release_name:
        description: 'Release Name'
        required: false
        default: 'NagramNX Release'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 ndk;27.2.12479018 platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Build Credentials
        run: |
          echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID || '38764664' }}" >> local.properties
          echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH || 'cd3e327ff26f9af9a72ec91f3d452c54' }}" >> local.properties
          echo "KEYSTORE_PASS=android" >> local.properties
          echo "ALIAS_NAME=androiddebugkey" >> local.properties
          echo "ALIAS_PASS=android" >> local.properties

      - name: Build APKs
        run: |
          ./gradlew assembleRelease -x uploadCrashlyticsMappingFileRelease

      - name: Generate Checksums
        run: |
          cd TMessagesProj/build/outputs/apk/release/
          sha256sum *.apk > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          files: |
            TMessagesProj/build/outputs/apk/release/*.apk
            TMessagesProj/build/outputs/apk/release/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
